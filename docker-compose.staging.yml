services:
  secretaria-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: secretaria-ia-dev
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - GIT_BRANCH=develop
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-mysql://secretaria_user:secretaria_pass@mariadb-dev:3306/secretaria_dev_db}
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
    networks:
      - secretaria-dev-net
    depends_on:
      - mariadb-dev

  mariadb-dev:
    image: mariadb:11.4
    container_name: secretaria-mariadb-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_pass}
      MYSQL_DATABASE: secretaria_dev_db
      MYSQL_USER: secretaria_user
      MYSQL_PASSWORD: secretaria_pass
    ports:
      - "3308:3306" # Porta 3308 para não conflitar com produção (3305)
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    networks:
      - secretaria-dev-net

  phpmyadmin-dev:
    image: phpmyadmin/phpmyadmin:latest
    container_name: secretaria-phpmyadmin-dev
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb-dev
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_pass}
      UPLOAD_LIMIT: 64M
    ports:
      - "8096:80" # Porta 8096 para o phpMyAdmin de DEV
    networks:
      - secretaria-dev-net
    depends_on:
      - mariadb-dev

volumes:
  mariadb_dev_data:
    driver: local

networks:
  secretaria-dev-net:
    driver: bridge
