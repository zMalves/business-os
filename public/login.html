<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Secretary AI Agent</title>
  <meta name="description" content="Acesse o painel executivo da Secretary AI Agent by Malves.">

  <!-- Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="style.css?v=20260928_1955">

  <style>
    /* ==========================================================================
       LOGIN SCREEN — EXECUTIVE CYPRUS & SAND THEME
       - Dynamic Center Halo & Ambient Mesh behind Login Card
       - Geometric Dot Matrix Canvas
       - Integrated Card Header
       - Password Visibility Toggle
       ========================================================================== */
    
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      color: var(--color-ink);
      background-color: var(--color-sand);
      overflow: hidden;
      position: relative;
      padding: 24px 16px;
    }

    /* 1. LAYERED CANVAS BACKGROUND & GRID */
    .login-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Malha de pontos geométrica sutil */
    .bg-dot-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 70, 67, 0.14) 1.2px, transparent 1.2px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
      opacity: 0.85;
    }

    /* Camada de Gradiente Suave de Fundo */
    .bg-gradient-underlay {
      position: absolute;
      inset: -50px;
      background: 
        radial-gradient(ellipse at 15% 15%, rgba(0, 70, 67, 0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(46, 196, 182, 0.10) 0%, transparent 55%),
        linear-gradient(135deg, rgba(0, 70, 67, 0.04) 0%, var(--color-sand) 100%);
    }

    /* Esferas de Luz Flutuantes */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .orb-top-right {
      top: -12%;
      right: 8%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 70, 67, 0.22) 0%, transparent 70%);
      filter: blur(70px);
      animation: floatAmbient 16s ease-in-out infinite alternate;
    }

    .orb-bottom-left {
      bottom: -12%;
      left: 6%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(46, 196, 182, 0.18) 0%, transparent 70%);
      filter: blur(65px);
      animation: floatAmbient 20s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatAmbient {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, -25px) scale(1.08); }
      100% { transform: translate(-25px, 20px) scale(0.94); }
    }

    /* 2. LOGIN MAIN WRAPPER & CENTRAL AURA */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      animation: loginEntrance 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes loginEntrance {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* EFEITO DE HALO E AURA LUMINOSA ATRÁS DA CAIXA DE LOGIN */
    .card-backdrop-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120%;
      height: 120%;
      pointer-events: none;
      z-index: -1;
    }

    /* Camada 1: Halo central profundo Cyprus */
    .card-backdrop-aura::before {
      content: '';
      position: absolute;
      inset: -15px;
      border-radius: 40px;
      background: radial-gradient(ellipse at center, rgba(0, 70, 67, 0.32) 0%, rgba(46, 196, 182, 0.20) 45%, rgba(224, 159, 62, 0.08) 65%, transparent 75%);
      filter: blur(42px);
      animation: pulseAura 7s ease-in-out infinite alternate;
    }

    /* Camada 2: Rotação sutil de luz cônica */
    .card-backdrop-aura::after {
      content: '';
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      border-radius: 50%;
      background: conic-gradient(from 0deg at 50% 50%, rgba(0, 70, 67, 0.18) 0deg, rgba(46, 196, 182, 0.25) 90deg, rgba(224, 159, 62, 0.12) 180deg, rgba(0, 70, 67, 0.18) 360deg);
      filter: blur(55px);
      animation: rotateAura 22s linear infinite;
      opacity: 0.75;
    }

    @keyframes pulseAura {
      0% { transform: scale(0.92); opacity: 0.65; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes rotateAura {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 3. LOGIN GLASS CARD */
    .login-card {
      position: relative;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(216, 210, 197, 0.85);
      border-radius: var(--radius-md);
      padding: 38px 32px;
      box-shadow: 
        0 24px 60px -12px rgba(0, 70, 67, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset,
        0 2px 6px rgba(0, 70, 67, 0.04);
      transition: box-shadow 0.3s ease;
    }

    /* 4. CABEÇALHO INTEGRADO */
    .login-card-header {
      text-align: center;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--color-cyprus) 0%, var(--color-cyprus-deep) 100%);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      font-weight: 800;
      box-shadow: 0 8px 24px var(--primary-glow);
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .login-card-header h1 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--color-cyprus);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .login-card-header p {
      font-size: 0.82rem;
      color: var(--color-slate);
      font-weight: 500;
    }

    /* 5. CAMPOS DO FORMULÁRIO */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--color-ink);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 15px;
      font-size: 0.9rem;
      font-family: var(--font-sans);
      color: var(--color-ink);
      background: #FFFFFF;
      border: 1px solid var(--color-sand-border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--color-cyprus);
      box-shadow: 0 0 0 3.5px var(--color-cyprus-glow);
    }

    .form-input::placeholder {
      color: var(--color-muted);
    }

    /* 6. PASSWORD INPUT COM EYE TOGGLE */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper .form-input {
      padding-right: 44px;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--color-muted);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .password-toggle-btn:hover {
      color: var(--color-cyprus);
    }

    /* 7. BOTÃO DE ENTRAR */
    .btn-submit-login {
      width: 100%;
      margin-top: 10px;
      padding: 13px 18px;
      font-size: 0.94rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      background: var(--color-cyprus);
      color: #FFFFFF;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .btn-submit-login:hover {
      background: var(--color-cyprus-deep);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    .btn-submit-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <!-- Canvas com Iluminação & Malha de Pontos -->
  <div class="login-canvas" aria-hidden="true">
    <div class="bg-gradient-underlay"></div>
    <div class="bg-dot-grid"></div>
    <div class="ambient-orb orb-top-right"></div>
    <div class="ambient-orb orb-bottom-left"></div>
  </div>

  <!-- Container Central de Login -->
  <div class="login-wrapper">
    <!-- Efeito de Halo & Aura Dinâmica atrás da Caixa -->
    <div class="card-backdrop-aura" aria-hidden="true"></div>

    <div class="login-card">
      
      <!-- Cabeçalho Integrado na Caixa -->
      <div class="login-card-header">
        <div class="brand-logo-badge" title="Secretary AI Agent">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <h1>Secretary AI Agent</h1>
        <p>Assistente Executiva Inteligente & Automação Corporativa</p>
      </div>

      <!-- Formulário de Login Reativo -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">E-mail Corporativo</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-input"
            placeholder="seu.email@empresa.com" 
            value="maychel.alvesz@gmail.com" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="login-password">Senha de Acesso</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="login-password" 
              class="form-input"
              placeholder="Digite sua senha..." 
              required 
              autocomplete="current-password"
            />
            <button 
              type="button" 
              class="password-toggle-btn" 
              id="btn-toggle-password" 
              onclick="togglePasswordVisibility()" 
              title="Exibir/Ocultar senha"
              aria-label="Alternar exibição de senha"
            >
              <i class="fa-regular fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit-login" id="btn-submit">
          <span id="btn-text"><i class="fa-solid fa-arrow-right-to-bracket"></i> Acessar Painel</span>
          <i class="fa-solid fa-circle-notch fa-spin" id="btn-spinner" style="display: none;"></i>
        </button>
      </form>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script>
    // 1. Toggle de Visibilidade de Senha (Eye / Eye-Slash)
    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('toggle-password-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    // 2. Notificações Toast
    function showToast(message, type = 'info', title = null, duration = 4000) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const defaultTitles = {
        success: 'Sucesso',
        error: 'Erro de Autenticação',
        warning: 'Aviso',
        info: 'Notificação'
      };

      const icons = {
        success: '<i class="fa-solid fa-circle-check"></i>',
        error: '<i class="fa-solid fa-circle-xmark"></i>',
        warning: '<i class="fa-solid fa-triangle-exclamation"></i>',
        info: '<i class="fa-solid fa-circle-info"></i>'
      };

      const toastTitle = title || defaultTitles[type] || 'Aviso';

      const toastEl = document.createElement('div');
      toastEl.className = `toast toast-${type}`;
      toastEl.setAttribute('role', 'alert');
      toastEl.innerHTML = `
        <div class="toast-icon">${icons[type] || icons.info}</div>
        <div class="toast-content">
          <div class="toast-title">${toastTitle}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" title="Fechar" onclick="this.parentElement.remove()">&times;</button>
        <div class="toast-progress" style="animation-duration: ${duration}ms;"></div>
      `;

      container.appendChild(toastEl);
      setTimeout(() => {
        if (toastEl.parentNode) toastEl.remove();
      }, duration);
    }

    // 3. Submissão do Formulário de Login
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const btnSubmit = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      btnSubmit.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          if (data.token) {
            localStorage.setItem('secretary_token', data.token);
          }
          showToast('Credenciais autenticadas! Acessando painel...', 'success', 'Login Concluído');
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          showToast(data.error || 'Credenciais inválidas. Verifique seu e-mail e senha.', 'error');
          btnSubmit.disabled = false;
          btnText.style.display = 'inline-flex';
          btnSpinner.style.display = 'none';
        }
      } catch (err) {
        showToast('Falha na comunicação com o servidor: ' + err.message, 'error');
        btnSubmit.disabled = false;
        btnText.style.display = 'inline-flex';
        btnSpinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
